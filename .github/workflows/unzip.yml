name: Unzip repo files
on:
  workflow_dispatch:
jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Unzip and commit files
        run: |
          if [ ! -f toml-key-sort-checker-cli.zip ]; then
            echo "zip file toml-key-sort-checker-cli.zip not found"
            exit 1
          fi
          mkdir -p extracted_tmp
          unzip -o toml-key-sort-checker-cli.zip -d extracted_tmp
          cp -a extracted_tmp/. .
          echo "--- ci.yml content (copy this into .github/workflows/ci.yml by hand after this run) ---"
          cat .github/workflows/ci.yml
          echo "--- end of ci.yml ---"
          rm .github/workflows/ci.yml
          rm -rf extracted_tmp toml-key-sort-checker-cli.zip
          git config user.name "haiderstudio"
          git config user.email "248293071+haiderstudio@users.noreply.github.com"
          git add -A
          git commit -m "Add repo files"
          git push
